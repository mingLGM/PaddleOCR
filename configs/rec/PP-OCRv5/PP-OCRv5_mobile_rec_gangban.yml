Global:
  model_name: PP-OCRv5_mobile_rec # To use static model for inference.
  debug: false
  use_gpu: true
  epoch_num: 500
  log_smooth_window: 20
  print_batch_step: 200
  save_model_dir: ./output/gangban/PP-OCRv5_mobile_rec
  save_epoch_step: 50
  eval_batch_step: [0, 10]
  cal_metric_during_train: true
  pretrained_model: ./pretrained_model/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints: 
  save_inference_dir: ./output/gangban/PP-OCRv5_mobile_rec/PP-OCRv5_mobile_rec_infer/
  use_visualdl: true
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ./ppocr/utils/dict/ppocrv5_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/gangban/rec/predicts_ppocrv5.txt
  d2s_train_image_shape: [3, 48, 320]
  # use_amp: true
  # amp_level: O2
  # amp_dtype: bfloat16

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 20
  regularizer:
    name: L2
    factor: 3.0e-05
  gradient_accumulation_steps: 2  # 梯度累积


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
        weight: 0.7  # 增加CTC损失的权重
    - NRTRLoss:
        weight: 0.3  # 减少NRTR损失的权重


PostProcess:  
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/rec/
    ext_op_transform_idx: 1
    label_file_list:
    - /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/rec/rec_label_train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 4
    fix_bs: false
    divided_factor: [8, 16] # w, h
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 32
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/rec/
    label_file_list:
    - /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/rec/rec_label_val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 4
