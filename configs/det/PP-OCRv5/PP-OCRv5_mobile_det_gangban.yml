Global:
  model_name: PP-OCRv5_mobile_det # To use static model for inference.
  debug: false
  use_gpu: true
  epoch_num: &epoch_num 500
  log_smooth_window: 20
  print_batch_step: 200
  save_model_dir: ./output/gangban/PP-OCRv5_mobile_det_data640
  save_epoch_step: 50
  eval_batch_step:
  - 0
  - 20
  cal_metric_during_train: false
  checkpoints: 
  pretrained_model: ./pretrained_model/PP-OCRv5_mobile_det_pretrained.pdparams   ## /home/hc/work/lzm/code/PaddleOCR/output/gangban/PP-OCRv5_mobile_det_data640_20250911/best_model/model.pdparams
  # pretrained_model: /home/hc/work/lzm/code/PaddleOCR/output/gangban/PP-OCRv5_mobile_det_data640_20250911/best_model/model.pdparams
  save_inference_dir: ./output/gangban/PP-OCRv5_mobile_det/gangban_PP-OCRv5_mobile_det_infer/
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./output/gangban/det_db/predicts_db.txt
  d2s_train_image_shape: [3, 640, 640]
  distributed: true
  # freeze_params: backbone.  # 冻结所有以 backbone. 开头的参数
  # use_amp: true
  # amp_level: O2
  # amp_dtype: bfloat16

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: True
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: True
  Head:
    name: DBHead
    k: 50
    fix_nan: True

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 6    ##尝试​​增大 alpha(如 4 或 5)​​，让 DiceLoss 占据更大比重，促使模型更关注文本区域的整体形状和完整性，这可能有助于减少边缘丢失.同时，可以​​略微降低 beta(如 6 或 7)​​ 作为平衡。
  beta: 5
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001 #(8*8c)
    warmup_epoch: 10
  regularizer:
    name: L2
    factor: 5.0e-05
  gradient_accumulation_steps: 2  # 梯度累积

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.3
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/det_640/
    label_file_list:
      - /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/det_640/det_label_640_train_add.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -180
            - 180
            p: 0.5
        - type: Resize
          args:
            size:
            - 1
            - 3
        # - type: Blur
        #   args:
        #     blur_limit: [3, 7]
        #     p: 0.2
        - type: CLAHE # 使用CLAHE增强对比度，有助于模型学习微弱字符
          args:
            clip_limit: 4.0   # 对比度限制
            p: 0.8
        - type: ColorJitter
          args:
            brightness: 0.5  # 亮度抖动强度
            contrast: 0.5    # 对比度抖动强度
            saturation: 0.5  # 饱和度抖动强度
            hue: 0.1         # 色调抖动强度（通常较小）
            p: 0.8           # 应用概率，可设置较高
    - EastRandomCropData:
        size:
        - 640
        - 640
        max_tries: 300
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: true
    batch_size_per_card: 16
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/det_640/
    label_file_list:
      - /home/hc/work/lzm/datasets/gangban/paddleocr_dataset/det_640/det_label_640_val_add.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 16
profiler_options: null
